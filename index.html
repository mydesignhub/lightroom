<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <!-- រូប Icon តូចដែលបង្ហាញលើ Tab របស់ Browser -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    
    <!-- ការកំណត់ Viewport ឱ្យសមស្របនឹងអេក្រង់ទូរស័ព្ទ និងទប់ស្កាត់ការ Zoom ពេលចុច Slider -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>My Design Lightroom Master</title>

    <!-- 📱 ជំហានសំខាន់សម្រាប់ PWA -->
    
    <!-- ភ្ជាប់ទៅកាន់ឯកសារ manifest.json ដើម្បីប្រាប់ឈ្មោះ App និងរូប Icon ពេលដំឡើង -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- កំណត់ពណ៌សម្រាប់របារខាងលើ (Address Bar) ឱ្យស៊ីនឹងពណ៌ App -->
    <meta name="theme-color" content="#121212">

    <!-- ការកំណត់ពិសេសសម្រាប់ឧបករណ៍ iOS (iPhone/iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ម៉ាយឌីហ្សាញ">
    <link rel="apple-touch-icon" href="/logo.svg">

    <!-- ⚙️ ចុះឈ្មោះ Service Worker ដើម្បីឱ្យ App ដើរលឿន និងប្រើ Offline បានខ្លះៗ -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker: ដំណើរការជោគជ័យ!'))
            .catch(err => console.log('PWA Service Worker: បរាជ័យ', err));
        });
      }
    </script>
    
  </head>
  <body>
    <!-- ទីតាំងដែលកូដ React របស់បងនឹងបង្ហាញខ្លួន -->
    <div id="root"></div>
    
    <!-- ភ្ជាប់ទៅកាន់កូដមេរបស់ React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
